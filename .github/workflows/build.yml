name: Build

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # wrapper checksum validation + dependency caching
      - uses: gradle/actions/setup-gradle@v4

      - name: Build both Minecraft versions
        run: ./gradlew build --stacktrace

      - name: Collect jars
        run: |
          mkdir -p staging
          find versions -path '*/build/libs/*.jar' ! -name '*-sources*' -exec cp {} staging/ \;

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: foxy-jars
          path: staging/*.jar
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: versions/*/build/reports/
          if-no-files-found: ignore
